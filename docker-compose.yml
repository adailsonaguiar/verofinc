services:
  mongodb:
    image: mongo:7.0
    container_name: app_finc_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: vero_finc
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./vero_finc_backend
      dockerfile: Dockerfile
    container_name: app_finc_backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/vero_finc?authSource=admin
      PORT: 3030
      NODE_ENV: production
    ports:
      - '3030:3030'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./ver_finc_frontend
      dockerfile: Dockerfile
      # VITE_API_URL não é definido intencionalmente: o .dockerignore exclui o .env,
      # então api.ts usará o fallback '/api', proxiado pelo nginx para http://backend:3030/
    container_name: app_finc_frontend
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  app_network:
    driver: bridge
